[package]
name = "wgpu-native"
version = "0.0.0"
authors = [
	"Dzmitry Malyshau <kvark@mozilla.com>",
	"Joshua Groves <josh@joshgroves.com>",
	"Noah Charlton <ncharlton002@gmail.com>",
	"Almar Klein <almar@almarklein.org>",
	"Rajesh Malviya <rajveer0malviya@gmail.com>",
]
edition = "2021"
rust-version = "1.87"
description = "Native WebGPU implementation based on wgpu-core"
homepage = "https://github.com/gfx-rs/wgpu-native"
repository = "https://github.com/gfx-rs/wgpu-native"
keywords = ["graphics"]
categories = ["graphics", "rendering"]
license = "MIT OR Apache-2.0"

[workspace]
members = [".", "wgpu-c-backend/", "wgpu-c-bindings/"]
default-members = [".", "wgpu-c-backend/", "wgpu-c-bindings/"]
resolver = "2"

[workspace.dependencies.wgpu]
package = "wgpu"
git = "https://github.com/gfx-rs/wgpu.git"
rev = "1a3a4cc27d8082dfd07beaf76dcf3dfb78dda321"

[workspace.dependencies.wgc]
package = "wgpu-core"
git = "https://github.com/gfx-rs/wgpu.git"
rev = "1a3a4cc27d8082dfd07beaf76dcf3dfb78dda321"

[workspace.dependencies.wgt]
package = "wgpu-types"
git = "https://github.com/gfx-rs/wgpu.git"
rev = "1a3a4cc27d8082dfd07beaf76dcf3dfb78dda321"

[workspace.dependencies.hal]
package = "wgpu-hal"
git = "https://github.com/gfx-rs/wgpu.git"
rev = "1a3a4cc27d8082dfd07beaf76dcf3dfb78dda321"

[workspace.dependencies.naga]
package = "naga"
git = "https://github.com/gfx-rs/wgpu.git"
rev = "1a3a4cc27d8082dfd07beaf76dcf3dfb78dda321"

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["wgsl", "spirv", "glsl", "dx12", "metal", "vulkan", "gles"]

## Enables the DX12 backend on Windows.
dx12 = ["wgc/dx12"]

## Enables the Metal backend on macOS & iOS.
metal = ["wgc/metal"]

## Enables the GLES backend via [ANGLE](https://github.com/google/angle) on macOS using.
angle = ["wgc/angle"]

## Enables the Vulkan backend on Windows, Linux, and Android.
vulkan = ["wgc/vulkan"]
## Enables the OpenGL/GLES backend on Windows, Linux, Android.
gles = ["wgc/gles"]

## Enables the Vulkan backend on macOS & iOS.
vulkan-portability = ["wgc/vulkan-portability"]

#! **Note:** In the documentation, if you see that an item depends on a backend,
#! it means that the item is only available when that backend is enabled _and_ the backend
#! is supported on the current platform.

#! ### Shading language support
# --------------------------------------------------------------------

## Enable accepting SPIR-V shaders as input.
spirv = ["naga/spv-in", "wgc/spirv"]

## Enable accepting GLSL shaders as input.
glsl = ["naga/glsl-in", "wgc/glsl"]

## Enable accepting WGSL shaders as input.
wgsl = ["naga/wgsl-in", "wgc/wgsl"]

#! ### Logging & Tracing
# --------------------------------------------------------------------
#! The following features do not have any effect on the WebGPU backend.

## Apply run-time checks, even in release builds. These are in addition
## to the validation carried out at public APIs in all builds.
strict_asserts = ["wgc/strict_asserts", "wgt/strict_asserts"]

## Log all API entry points at info instead of trace level.
api_log_info = ["wgc/api_log_info"]

## Enable resource counters returned by wgpuDeviceGetInternalCounters.
counters = ["wgc/counters"]

## Enables serialization via `serde` on common wgpu types.
serde = ["dep:serde", "wgc/serde"]

## Allow deserializing of trace capture files that were written with the `trace` feature.
## To replay a trace file use the [wgpu player](https://github.com/gfx-rs/wgpu/tree/trunk/player).
replay = ["serde", "wgc/replay"]

#! ### Backend features
# --------------------------------------------------------------------

## Support creating surfaces from DRM display/window handles (Linux KMS/DRM, no X11/Wayland).
drm = ["wgc/drm"]

#! ### External libraries
# --------------------------------------------------------------------

## Enables statically linking DXC.
##
## Normally, to use the modern DXC shader compiler with wgpu, the final application
## must be shipped alongside `dxcompiler.dll` (min v1.8.2502). This feature statically
## links a version of DXC so that no external binaries are required to compile DX12 shaders.
static-dxc = ["wgc/static-dxc"]

## Enable portable atomics on platforms that do not support 64-bit atomics.
portable-atomic = ["wgc/portable-atomic"]

[dependencies.wgc]
workspace = true

[dependencies.hal]
workspace = true

[target.'cfg(all(unix, not(target_os = "ios"), not(target_os = "macos")))'.dependencies]
hal = { workspace = true, features = ["renderdoc"] }

[target.'cfg(windows)'.dependencies]
hal = { workspace = true, features = ["dx12", "renderdoc"] }

[dependencies.wgt]
workspace = true

[dependencies.naga]
workspace = true
optional = true

[dependencies.serde]
version = "1"
optional = true

[dependencies]
raw-window-handle = "0.6.0"
paste = "1"
log = "0.4"
thiserror = "2"
parking_lot = "0.12"
smallvec = "1"
bitflags = "2"

[build-dependencies]
bindgen = "0.72"
