name: "Install Agility SDK"
description: "Install the D3D12 Agility SDK and export its environment variables"
runs:
  using: "composite"
  steps:
    - shell: bash
      # `cargo xtask` is a host build tool; don't inherit the job's
      # CARGO_BUILD_TARGET (e.g. x86_64-pc-windows-gnu), which isn't installed
      # in the rustup toolchain this bash shell uses.
      env:
        CARGO_BUILD_TARGET: ""
      run: |
        set -e

        cd .local-wgpu
        cargo xtask install-agility-sdk >> "$GITHUB_ENV"
        echo WGPU_DX12_AGILITY_SDK_REQUIRE=1 >> "$GITHUB_ENV"
