      - name: fxc
        doc: |
          Use the FXC (D3DCompile) shader compiler.

          The FXC compiler is old, slow, and unmaintained. However, it doesn't
          require any additional DLLs to be shipped with the application.
      - name: dxc
        doc: |
          Use the DXC (DirectX Shader Compiler).
